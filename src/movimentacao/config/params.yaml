control_server:
  ros__parameters:
    use_sim_time: false

    titan:
      enabled: true
      sensors: ["titan"]
      titan:
        can_id: 42
        motor_freq: 15600
        encoder_rate_hz: 20
        motor_update_rate_hz: 50
        limit_switches: false
        enable_freshness: false
        m_0:
          encoder_mode: "quadrature"
          cpr: 1440
          dist_per_tick: 13.5236
          invert_motor: false
          invert_encoder: false
          invert_rpm: false
        m_1:
          encoder_mode: "quadrature"
          cpr: 1440
          dist_per_tick: 13.5236
          invert_motor: false
          invert_encoder: false
          invert_rpm: false
        m_2:
          encoder_mode: "quadrature"
          cpr: 1440
          dist_per_tick: 13.5236
          invert_motor: false
          invert_encoder: false
          invert_rpm: false
        m_3:
          encoder_mode: "quadrature"
          cpr: 1440
          dist_per_tick: 13.5236
          invert_motor: false
          invert_encoder: false
          invert_rpm: false

    servo:
      enabled: true
      sensors: ["servo0"]
      servo0:
        port: 14
        type: "standard"

no_movimentacao:
  ros__parameters:
    fator_linear: -83.59 
    fator_angular: 100.0

slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: mapping
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT

    map_resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30